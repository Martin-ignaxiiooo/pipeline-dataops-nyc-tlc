services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "nyc_tlc_trips"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nyc_tlc_trips"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "nyc_tlc_trips"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
    volumes:
      - .:/app
    command: ["python", "src/main.py"]
